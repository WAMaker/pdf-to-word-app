name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: bash
        run: |
          # 把 tag 版本号写入 APP_VERSION(保持 exe 内版本与 tag 同步)
          VERSION="v${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "v" ]; then VERSION="v1.4.0"; fi
          python -c "import re,pathlib; p=pathlib.Path('app/main.py'); s=p.read_text(); s=re.sub(r'APP_VERSION = \\"v[^\\"]*\\"', f'APP_VERSION = \\"{VERSION}\"', s); p.write_text(s)"
          pyinstaller --noconfirm --onefile --windowed --name "PDF转Word" run_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF转Word-windows
          path: dist/PDF转Word.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF转Word.exe
          generate_release_notes: false
          name: PDF转Word v${{ github.ref_name }}
          body: |
            ## PDF 转 Word v${{ github.ref_name }}

            - 段落重建:PDF 转 Word 后为完整逻辑段落,改字号不乱版
            - 图片保留:PDF 图片自动提取嵌入 Word
            - 效果预览:切换字号/字体即时预览
            - 字号:小四~二号 6 档可选
            - 字体:微软雅黑 / 宋体 / 黑体 / 楷体 / 仿宋

            下载 `PDF转Word.exe` 即可使用(无需安装)。
